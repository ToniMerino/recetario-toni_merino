<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <title>Recetario Toni Merino · v1.8.1</title>
  <link rel="manifest" href="manifest.webmanifest?v=1.8.1">
  <link rel="stylesheet" href="styles.css?v=1.8.1">
</head>
<body>
<header class="topbar">
  <div>
    <h1>Recetario Toni Merino</h1>
    <p>Versión 1.8.1</p>
  </div>
  <button id="addBtn" class="round-btn" aria-label="Añadir ficha">＋</button>
</header>
<main>
  <section id="catalogView">
    <input id="searchInput" class="search" type="search" placeholder="Buscar receta, familia, autor, etiqueta, ingrediente o dieta">
    <div class="chips">
      <button class="chip active" data-filter="all">Todas</button>
      <button class="chip" data-filter="recipe">Recetas</button>
      <button class="chip technique" data-filter="technique">Técnicas</button>
      <button class="chip favorite-chip" data-filter="favorite">★ Favoritas</button>
    </div>
    <div class="advanced-filters">
      <label>Familia
        <select id="familyFilter"><option value="all">Todas las familias</option></select>
      </label>
      <label>Características
        <select id="featureFilter">
          <option value="all">Todas</option>
          <option value="thermomix">Thermomix</option>
          <option value="airfryer">Air Fryer</option>
          <option value="tested">Probadas</option>
          <option value="excellent">Excelente</option>
          <option value="vegetarian">Vegetarianas</option>
          <option value="vegan">Veganas</option>
          <option value="favorite">Favoritas</option>
        </select>
      </label>
      <label>Ordenar
        <select id="sortFilter">
          <option value="az">Título A–Z</option>
          <option value="za">Título Z–A</option>
          <option value="favorites">Favoritas primero</option>
          <option value="family">Familia culinaria</option>
          <option value="kind">Recetas / Técnicas</option>
        </select>
      </label>
    </div>
    <div id="stats" class="catalog-stats" aria-label="Resumen del recetario"></div>
    <p id="count" class="count"></p>
    <div id="catalog" class="catalog"></div>
  </section>

  <section id="detailView" class="hidden">
    <div class="detail-nav"><button id="backBtn" class="back-btn">← Volver al catálogo</button><button id="topPrintBtn" class="back-btn secondary-action">Imprimir / PDF</button></div>
    <article id="detail" class="detail"></article>
  </section>

  <section id="formView" class="hidden">
    <button id="cancelBtn" class="back-btn">← Cancelar</button>
    <form id="recipeForm" class="form-card">
      <input type="hidden" name="id">
      <h2 id="formTitle">Añadir ficha</h2>
      <label>Tipo de ficha
        <select name="record_type">
          <option value="recipe">Receta</option>
          <option value="technique">Técnica culinaria</option>
        </select>
      </label>
      <label>Título<input name="title" required></label>
      <label>Procedencia<input name="origin"></label>
      <label>Autor o familiar<input name="author"></label>
      <div class="two-cols">
        <label>Tipo<input name="type"></label>
        <label>Familia culinaria<input name="family"></label>
        <label>Raciones<input name="servings"></label>
        <label>Tiempo<input name="time"></label>
        <label>Dificultad<input name="difficulty"></label>
        <label>Estado<input name="status"></label>
      </div>
      <label>Ingredientes<textarea name="ingredients" required placeholder="Un ingrediente por línea"></textarea></label>
      <label>Preparación<textarea name="steps" required placeholder="Un paso por línea"></textarea></label>
      <label>Presentación<textarea name="presentation"></textarea></label>
      <label>Consejos<textarea name="tips"></textarea></label>
      <label>Mi valoración<textarea name="notes"></textarea></label>
      <label>Etiquetas<input name="tags" placeholder="Arroces, Sopars, Nadal..."></label>
      <div class="two-cols">
        <label>Vegetariana
          <select name="vegetarian"><option value="false">No</option><option value="true">Sí</option></select>
        </label>
        <label>Vegana
          <select name="vegan"><option value="false">No</option><option value="true">Sí</option></select>
        </label>
      </div>
      <label>Observación dietética<textarea name="dietary_note"></textarea></label>
      <div class="form-actions">
        <button type="submit" class="primary">Guardar</button>
        <button type="button" id="exportBtn">Exportar copia</button>
        <label class="file-label">Importar copia<input id="importInput" type="file" accept=".json"></label>
      </div>
    </form>
  </section>
</main>
<script src="data.js?v=1.8.1"></script>
<script src="app.js?v=1.8.1"></script>
</body>
</html>
